name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --group dev
      - name: Lint (errors only)
        run: uvx ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: uv run --group dev pytest -q
